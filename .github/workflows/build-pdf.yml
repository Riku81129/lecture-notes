name: Build LaTeX PDFs

on:
  push:
    paths:
      - "tex/**"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: tex
          root_file: main.tex
          args: -pdfdvi -latexoption=-interaction=nonstopmode -latexoption=-halt-on-error -latexoption=-file-line-error

      - name: Move PDF
        run: |
          mkdir -p pdfs
          cp tex/main.pdf pdfs/main.pdf

      - name: Commit PDF
        uses: EndBug/add-and-commit@v9
        with:
          add: "pdfs/main.pdf"
          message: "Update compiled PDF"
